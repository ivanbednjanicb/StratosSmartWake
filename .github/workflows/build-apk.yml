name: Build Stratos Smart Wake APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action default includes the retired SDK 'tools' package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug :app:lintDebug scoreSelfTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StratosSmartWake-0.26-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
